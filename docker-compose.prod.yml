# ============================================================
# GitOps Secret Shield – Production Docker Compose
# Phase 2: Production-Ready Configuration
#
# Usage:
#   docker compose -f docker-compose.prod.yml up -d
#
# Requirements:
#   - Create .env.prod with real credentials (never commit it)
#   - Replace all placeholder values before deploying
# ============================================================

services:

  # ── PostgreSQL 16 ──────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: secret-shield-postgres-prod
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-secret_shield}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - backend-net
    # No external port exposed – only the backend service connects
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB:-secret_shield}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    deploy:
      resources:
        limits:
          memory: 512m

  # ── HashiCorp Vault ────────────────────────────────────────
  vault:
    image: hashicorp/vault:1.15
    container_name: secret-shield-vault-prod
    restart: always
    command: server -config=/vault/config/vault.hcl
    environment:
      VAULT_ADDR: http://0.0.0.0:8200
    volumes:
      - vault_data:/vault/data
      - ./vault/config:/vault/config:ro
    networks:
      - backend-net
    expose:
      - "8200"
    cap_add:
      - IPC_LOCK
    healthcheck:
      test: ["CMD", "vault", "status"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 256m

  # ── FastAPI Backend ────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: gitops-secret-shield-backend:2.0
    container_name: secret-shield-backend-prod
    restart: always
    env_file:
      - .env.prod
    environment:
      ENVIRONMENT: production
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-secret_shield}
      VAULT_ADDR: http://vault:8200
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-https://yourdomain.com}
    networks:
      - backend-net
      - frontend-net
    depends_on:
      postgres:
        condition: service_healthy
      vault:
        condition: service_started
    expose:
      - "8000"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    # Run as non-root user (defined in Dockerfile)
    user: "1001:1001"
    read_only: true
    tmpfs:
      - /tmp
    deploy:
      resources:
        limits:
          memory: 512m

  # ── Nginx Reverse Proxy ────────────────────────────────────
  nginx:
    image: nginx:1.27-alpine
    container_name: secret-shield-nginx-prod
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.prod.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - nginx_cache:/var/cache/nginx
    networks:
      - frontend-net
    depends_on:
      - backend
    deploy:
      resources:
        limits:
          memory: 128m

networks:
  backend-net:
    internal: true          # PostgreSQL and Vault are NOT reachable from outside
  frontend-net:

volumes:
  postgres_data:
    driver: local
  vault_data:
    driver: local
  nginx_cache:
    driver: local
